<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>해양사업본부 인력DB</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="logo">⚓</span>
    <div>
      <h1>해양사업본부 인력DB</h1>
      <p class="sub">프로젝트별 인력계획 · 통합 인력계획 · 유휴현황</p>
    </div>
  </div>
  <div class="top-actions">
    <span id="conn" class="conn off">미연결</span>
    <button id="btnSettings" class="btn ghost">설정</button>
  </div>
</header>

<nav id="tabs" class="tabs" role="tablist"></nav>

<main>
  <section class="toolbar">
    <input id="q" type="search" placeholder="성명·사업명·구분 검색" aria-label="검색">
    <div id="filters" class="filters"></div>
    <div id="yearChips" class="chips"></div>
    <div class="spacer"></div>
    <button id="btnReload" class="btn ghost" title="시트에서 다시 불러오기">새로고침</button>
    <button id="btnCsv" class="btn ghost">CSV</button>
    <button id="btnAdd" class="btn primary">+ 추가</button>
  </section>

  <section id="stats" class="stats"></section>

  <div id="msg" class="msg" hidden></div>
  <div class="table-wrap">
    <table id="grid"><thead></thead><tbody></tbody><tfoot></tfoot></table>
  </div>
</main>

<dialog id="dlgEdit" class="dlg">
  <form id="frmEdit" method="dialog">
    <header class="dlg-head">
      <h2 id="editTitle">레코드</h2>
      <button type="button" class="x" data-close aria-label="닫기">×</button>
    </header>
    <div class="dlg-body">
      <div id="fields" class="fields"></div>
      <div class="months-head">
        <h3>월별 투입(M/M)</h3>
        <div class="fill">
          <input id="fillVal" type="number" step="0.01" min="0" value="1" aria-label="채울 값">
          <button type="button" id="btnFill" class="btn small">시작~마감월 채우기</button>
          <button type="button" id="btnClearMonths" class="btn small ghost">월 비우기</button>
          <button type="button" id="btnSumMM" class="btn small ghost">월합계 → 총MM</button>
        </div>
      </div>
      <div id="months" class="months"></div>
    </div>
    <footer class="dlg-foot">
      <button type="button" id="btnDelete" class="btn danger">삭제</button>
      <span class="spacer"></span>
      <span id="monthSum" class="muted"></span>
      <button type="button" class="btn ghost" data-close>취소</button>
      <button type="submit" id="btnSave" class="btn primary">저장</button>
    </footer>
  </form>
</dialog>

<dialog id="dlgSettings" class="dlg narrow">
  <form id="frmSettings" method="dialog">
    <header class="dlg-head">
      <h2>연결 설정</h2>
      <button type="button" class="x" data-close aria-label="닫기">×</button>
    </header>
    <div class="dlg-body">
      <label>Apps Script 웹앱 URL
        <input id="setUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec" required>
      </label>
      <label>API 키 (스크립트 속성 API_KEY 를 설정한 경우)
        <input id="setKey" type="password" autocomplete="off">
      </label>
      <p class="muted">이 브라우저에만 저장됩니다.</p>
    </div>
    <footer class="dlg-foot">
      <span class="spacer"></span>
      <button type="button" class="btn ghost" data-close>취소</button>
      <button type="submit" class="btn primary">저장 후 연결</button>
    </footer>
  </form>
</dialog>

<div id="toast" class="toast" hidden></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
